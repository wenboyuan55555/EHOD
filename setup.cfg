[metadata]
name = ehod
version = 1.0.0
description = Event-aware hourly origin-destination demand prediction benchmark
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.8
include_package_data = True
install_requires =
    torch==2.4.1
    numpy==1.24.4
    pandas==2.0.3
    scipy==1.10.1
    scikit-learn==1.2.2
    einops==0.8.0
    xgboost==2.1.4

[options.packages.find]
include =
    ehod*
    baselines*

[options.package_data]
* =
    config.json
    upstream/**/*.py
    upstream/**/LICENSE
baselines = sources_lock.json

[options.extras_require]
events =
    faiss-cpu==1.8.0.post1
    sentence-transformers==3.2.1
    transformers==4.46.3
preprocess = pyarrow>=12

[options.entry_points]
console_scripts =
    ehod-run = ehod.reproduction.run:main
